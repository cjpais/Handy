[package]
name = "repro-recording-readiness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
loom = "0.7.2"
syn = { version = "2", features = ["full"] }

[build-dependencies]
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
