[package]
name = "handy"
version = "0.9.4"
description = "Handy"
authors = ["cjpais"]
edition = "2024"
license = "MIT"
default-run = "handy"

[profile.dev]
incremental = true

[lib]
name = "handy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }

[dependencies]
once_cell = "1.21.4"
tauri = { version = "2.11.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2.4.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.6.0"
tauri-plugin-fs = "2.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.18.1"
anyhow = "1.0.104"
rubato = "4.0.0"
audioadapter = "4.0"
audioadapter-buffers = "4.0"
hound = "3.5.1"
log = "0.4.33"
env_filter = "0.1.4"
tokio = "1.53.1"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/RustAudio/rodio" }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-util = "0.3.33"
rustfft = "6.4.1"
strsim = "0.11.1"
natural = "0.5.0"
regex = "1.13.1"
chrono = "0.4.45"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tar = "0.4.46"
flate2 = "1.1.9"
sha2 = "0.11.0"
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
transcribe-cpp = { version = "*", default-features = false }
handy-keys = "0.3.2"
ferrous-opencc = "0.4.0"
clap = { version = "4.6.4", features = ["derive"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.7.2"
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "cuda",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "*", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-cpp = { version = "*", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
gtk = "0.18.2"
transcribe-cpp = { version = "*", default-features = false, features = [
  "dynamic-backends",
  "cuda",
] }

[patch.crates-io]
tao = { git = "https://github.com/cjpais/tao" }
tao-macros = { git = "https://github.com/cjpais/tao" }
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", branch = "main" }
transcribe-cpp-sys = { git = "https://github.com/handy-computer/transcribe.cpp", branch = "main" }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"